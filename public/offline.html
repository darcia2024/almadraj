<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Sedang offline · Al Madraj</title>
  <link rel="icon" type="image/png" href="/pwa/favicon-64.png" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: radial-gradient(120% 70% at 50% 0%, #e5f4f2 0%, #ffffff 60%);
      color: #17231b; -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 380px; text-align: center; }
    .icon { display: block; margin: 0 auto; width: 88px; height: 88px; border-radius: 24px; box-shadow: 0 18px 40px rgba(0, 109, 119, .22); }
    .pill { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; padding: 6px 12px; border-radius: 999px; background: #fff4e0; color: #8a5a00; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #f2b84b; }
    h1 { margin: 16px 0 0; font-size: 28px; line-height: 1.15; letter-spacing: -.02em; }
    p { margin: 12px 0 0; color: #607568; font-size: 14.5px; line-height: 1.65; }
    button {
      margin-top: 28px; width: 100%; min-height: 50px; border: 0; border-radius: 999px; cursor: pointer;
      background: #006d77; color: #fff; font: inherit; font-size: 15px; font-weight: 700;
      box-shadow: 0 10px 22px rgba(0, 109, 119, .22);
    }
    button:active { transform: scale(.98); }
    small { display: block; margin-top: 18px; color: #8aa192; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/pwa/icon-192.png" alt="Al Madraj" width="88" height="88" />
    <div class="pill"><span class="dot"></span>Tidak ada koneksi</div>
    <h1>Kamu sedang offline.</h1>
    <p>Halaman ini belum tersimpan di perangkat. Sambungkan internet, lalu coba lagi — progress belajarmu tetap aman di akun.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
    <small>Halaman akan dimuat ulang otomatis saat koneksi kembali.</small>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
